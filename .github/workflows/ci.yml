name: Week 0 checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml ruff matplotlib pandas rdkit h5py nbformat
          numpy==2.5.3 scikit-learn==1.9.1 xgboost==3.4.1
          "thermoml-io[export,pandas]"
      - name: Lint project
        run: python -m ruff check scripts src probes tests notebooks
      - name: Compile project
        run: python -m compileall -q scripts src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Week 0 artifacts
        run: python scripts/verify_week0.py
      - name: Verify Week 1 and Week 2 artifacts
        run: python scripts/verify_week1.py
      - name: Verify dataset v0.1 artifacts
        run: python scripts/verify_dataset_v01.py
      - name: Verify dataset v0.2 artifacts
        run: python scripts/verify_dielectric_v02.py
      - name: Verify dielectric v0.3 artifacts
        run: python scripts/verify_dielectric_v03.py
      - name: Verify dielectric v0.3.2 artifacts
        run: python scripts/verify_dielectric_v032.py
      - name: Verify the v1.x temperature-resolved observation table
        run: python scripts/verify_dielectric_observations.py
      - name: Verify the merged v1.x observation table
        run: python scripts/verify_dielectric_observations_v11plus.py
      - name: Verify paper drafts against frozen artifacts
        run: python scripts/check_paper_artifact_consistency.py
      - name: Verify generated paper draft is current
        run: python scripts/build_paper_full_draft.py --check
      - name: Verify paper figures are present and reproducible
        run: python scripts/verify_paper_figures.py
      - name: Verify Week 6 export manifest
        run: |
          python probes/export_week6_results.py --output-root "${{ runner.temp }}/electrolyte-week6" --overwrite
          python scripts/verify_export_manifests.py --output-dir "${{ runner.temp }}/electrolyte-week6/week6"
      - name: Verify anchor cross-check
        run: python scripts/verify_anchor_crosscheck.py
      - name: Verify dielectric GPR baseline
        run: python scripts/verify_dielectric_gpr_baseline.py
      - name: Verify dielectric baseline diagnostics
        run: python scripts/verify_dielectric_baseline_diagnostics.py
      - name: Verify Chodera cross-check
        run: python scripts/verify_chodera_crosscheck.py
      - name: Verify high-temperature dielectric extension
        run: python scripts/verify_dielectric_v01_ext.py
      - name: Verify dielectric kernel comparison
        run: python scripts/verify_dielectric_kernel_comparison.py
      - name: Verify dielectric representation ablation
        run: python scripts/verify_dielectric_representation_ablation.py
      - name: Verify D1 leave-EC-out sensitivity
        run: python scripts/verify_d1_leave_ec_out.py
      - name: Verify dielectric target transform and scaffold split
        run: python scripts/verify_dielectric_target_scaffold.py
      - name: Verify viscosity baseline
        run: python scripts/verify_viscosity_baseline.py
      - name: Verify AL Round-1 candidates
        run: python scripts/verify_al_round1.py
      - name: Verify P4 redox baseline
        run: python scripts/verify_p4_redox.py
      # Week 17 additions.  Every step below was checked to pass on a
      # simulated clean clone (tracked + non-ignored files only), so it does
      # not depend on a gitignored download cache.
      # scripts/verify_density_v01.py is deliberately NOT listed: its value
      # layer needs data/raw/thermoml_density/ (54 MB, gitignored) or the
      # committed data/processed/density_raw.csv, which is kept out of the
      # repository on purpose, so it is a tier-2 (local-cache) verifier.
      # scripts/verify_viscosity_v02.py --check is also deliberately NOT listed:
      # its value layer needs data/raw/thermoml_viscosity_pa_s/ or the 81 MB
      # data/processed/viscosity_v02_raw.csv, both kept out of the repository on
      # purpose, so it is a tier-2 (local-cache) verifier as well.
      - name: Verify dielectric v0.4 roster patch
        run: python scripts/verify_dielectric_v04.py
      - name: Verify liquid-window gate
        run: python scripts/verify_liquid_window_gate.py --check
      - name: Verify the Walden / donor-number channel
        run: python scripts/verify_walden_dn_channel.py --check
      - name: Verify the Uni-Mol probe specification
        run: python probes/verify_unimol_probe_spec.py --check
      - name: Verify the four-core cross-channel registry
        run: python scripts/verify_four_core_registry.py --check
      - name: Verify the W17-12 second-source orbital layer
        run: python scripts/verify_orbital_second_source.py --check
      - name: Verify the W17-14 THEMol / GFN2-xTB orbital layer
        run: python scripts/verify_themol_orbital_layer.py --check

  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: >-
          python -m pip install -e ".[dev]" h5py nbformat
          numpy==2.5.3 scikit-learn==1.9.1 xgboost==3.4.1
      - name: Verify installed environment
        run: python scripts/check_environment.py
