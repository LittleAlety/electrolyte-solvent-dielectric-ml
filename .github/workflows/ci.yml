name: Week 0 checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml ruff matplotlib pandas rdkit h5py nbformat
          numpy==2.5.3 scikit-learn==1.9.1 xgboost==3.4.1
          "thermoml-io[export,pandas]"
      - name: Lint project
        run: python -m ruff check scripts src probes tests notebooks
      - name: Compile project
        run: python -m compileall -q scripts src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Week 0 artifacts
        run: python scripts/verify_week0.py
      - name: Verify Week 1 and Week 2 artifacts
        run: python scripts/verify_week1.py
      - name: Verify dataset v0.1 artifacts
        run: python scripts/verify_dataset_v01.py
      - name: Verify dataset v0.2 artifacts
        run: python scripts/verify_dielectric_v02.py
      - name: Verify anchor cross-check
        run: python scripts/verify_anchor_crosscheck.py
      - name: Verify dielectric GPR baseline
        run: python scripts/verify_dielectric_gpr_baseline.py
      - name: Verify dielectric baseline diagnostics
        run: python scripts/verify_dielectric_baseline_diagnostics.py
      - name: Verify Chodera cross-check
        run: python scripts/verify_chodera_crosscheck.py
      - name: Verify high-temperature dielectric extension
        run: python scripts/verify_dielectric_v01_ext.py
      - name: Verify dielectric kernel comparison
        run: python scripts/verify_dielectric_kernel_comparison.py
      - name: Verify dielectric representation ablation
        run: python scripts/verify_dielectric_representation_ablation.py
      - name: Verify dielectric target transform and scaffold split
        run: python scripts/verify_dielectric_target_scaffold.py
      - name: Verify viscosity baseline
        run: python scripts/verify_viscosity_baseline.py
      - name: Verify AL Round-1 candidates
        run: python scripts/verify_al_round1.py
      - name: Verify P4 redox baseline
        run: python scripts/verify_p4_redox.py

  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: >-
          python -m pip install -e ".[dev]" h5py nbformat
          numpy==2.5.3 scikit-learn==1.9.1 xgboost==3.4.1
      - name: Verify installed environment
        run: python scripts/check_environment.py
