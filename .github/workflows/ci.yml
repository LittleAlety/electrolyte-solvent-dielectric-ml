name: Week 0 checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest pyyaml ruff matplotlib numpy pandas scikit-learn rdkit
          xgboost h5py nbformat "thermoml-io[export,pandas]"
      - name: Lint project
        run: python -m ruff check scripts src probes tests notebooks
      - name: Compile project
        run: python -m compileall -q scripts src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Week 0 artifacts
        run: python scripts/verify_week0.py
      - name: Verify Week 1 and Week 2 artifacts
        run: python scripts/verify_week1.py

  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]" h5py nbformat
      - name: Verify installed environment
        run: python scripts/check_environment.py
