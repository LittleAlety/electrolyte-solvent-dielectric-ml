name: Week 0 checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml ruff
      - name: Lint project
        run: python -m ruff check scripts src tests
      - name: Compile project
        run: python -m compileall -q scripts src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Week 0 artifacts
        run: python scripts/verify_week0.py
