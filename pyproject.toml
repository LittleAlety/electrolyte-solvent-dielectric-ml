[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolyte-ml"
version = "0.0.0"
description = "Human-in-the-loop ML for electrolyte solvent property prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "pandas",
  "rdkit>=2023.9",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "matplotlib",
  "pyyaml",
  "requests",
  "thermoml-io[export,pandas]>=0.1.3,<0.2",
]

[project.optional-dependencies]
dev = ["jupyterlab", "jupytext", "nbformat", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
